extends: ./electron-builder.yml
appId: local.fluentreader.personal
productName: Fluent Reader Personal
directories:
    output: ./bin/personal.8/
electronDist: ./node_modules/electron/dist
extraMetadata:
    name: fluent-reader-personal
    productName: Fluent Reader Personal
    version: 1.3.2-personal.8
artifactName: Fluent-Reader-Personal-${version}-win-${arch}.${ext}
files:
    - "./dist/**/*"
    - "!./dist/fontlist"
    - "!**/*.js.map"
    - "!node_modules/better-sqlite3/deps/**/*"
    - "!node_modules/better-sqlite3/src/**/*"
    - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
    - "!node_modules/better-sqlite3/prebuilds/linux*.node"
    - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
extraFiles:
    - from: README-personal.md
      to: 使用说明.md
    - from: LICENSE
      to: Fluent-Reader-LICENSE.txt
    - from: docs/USER_GUIDE.md
      to: 使用指南.md
    - from: docs/CHANGELOG.md
      to: 更新记录.md
    - from: node_modules/single-file-core/LICENSE
      to: SingleFile-AGPL-3.0.txt
    - from: docs/THIRD_PARTY.md
      to: 第三方组件说明.md
    - from: build/personal-source.zip
      to: Fluent-Reader-Personal-Source.zip
win:
    target:
        - nsis
        - zip
    signAndEditExecutable: true
    icon: build/icons/icon.ico
nsis:
    oneClick: false
    perMachine: false
    allowElevation: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
    artifactName: Fluent-Reader-Personal-${version}-Setup-${arch}.${ext}
